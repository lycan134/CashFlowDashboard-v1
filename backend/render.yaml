services:
  - type: web
    name: cashflow-backend
    runtime: python
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        sync: false

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      - key: CORS_ORIGINS
        sync: false